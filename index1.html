<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We'll Be Right Back — Under Maintenance</title>
<style>
  :root{
    --bg-1:#0b0f1e;
    --bg-2:#131a2e;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --accent-3:#ff6b9d;
    --text:#f3f4fb;
    --muted:#9aa3c0;
    --card:rgba(255,255,255,0.04);
    --card-border:rgba(255,255,255,0.09);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,92,255,0.25), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(34,211,238,0.20), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,107,157,0.18), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }

  /* Floating background orbs */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    pointer-events:none;
    z-index:0;
    animation:drift 18s ease-in-out infinite;
  }
  .orb.o1{width:280px;height:280px;background:var(--accent);top:8%;left:6%;animation-delay:0s;}
  .orb.o2{width:220px;height:220px;background:var(--accent-2);bottom:10%;right:8%;animation-delay:3s;}
  .orb.o3{width:180px;height:180px;background:var(--accent-3);bottom:22%;left:15%;animation-delay:6s;}

  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(20px,-30px) scale(1.08);}
  }

  .stars{
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 10% 65%, rgba(255,255,255,0.35), transparent);
    background-repeat:repeat;
    background-size:600px 600px;
    opacity:0.6;
    z-index:0;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--card-border);
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:28px;
    backdrop-filter:blur(6px);
  }
  .badge .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-3);
    box-shadow:0 0 0 0 rgba(255,107,157,0.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,107,157,0.55);}
    70%{box-shadow:0 0 0 9px rgba(255,107,157,0);}
    100%{box-shadow:0 0 0 0 rgba(255,107,157,0);}
  }

  .gear-scene{
    width:150px;
    height:150px;
    margin:0 auto 20px;
    position:relative;
  }
  .gear{
    position:absolute;
    color:transparent;
  }
  .gear svg{width:100%;height:100%;display:block;}
  .gear.big{
    width:96px;height:96px;
    top:6px; left:12px;
    animation:spin 9s linear infinite;
  }
  .gear.small{
    width:58px;height:58px;
    bottom:0; right:0;
    animation:spinReverse 6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @keyframes spinReverse{ to{ transform:rotate(-360deg);} }

  h1{
    font-size:clamp(28px, 5vw, 42px);
    font-weight:700;
    background:linear-gradient(90deg, #ffffff, var(--accent-2) 60%, var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.2;
    margin-bottom:14px;
  }

  p.lead{
    color:var(--muted);
    font-size:16px;
    line-height:1.65;
    max-width:480px;
    margin:0 auto 34px;
  }

  .progress-wrap{
    max-width:420px;
    margin:0 auto 40px;
  }
  .progress-track{
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    border:1px solid var(--card-border);
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    background-size:200% 100%;
    animation:shimmer 2.4s linear infinite;
    transition:width 0.9s cubic-bezier(.22,.9,.32,1);
  }
  @keyframes shimmer{
    0%{background-position:0% 0;}
    100%{background-position:200% 0;}
  }
  .progress-caption{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }
  .socials a{
    width:40px;height:40px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--muted);
    text-decoration:none;
    transition:all .2s ease;
  }
  .socials a:hover{
    color:var(--text);
    border-color:var(--accent-2);
    transform:translateY(-3px);
  }
  .socials svg{width:18px;height:18px;fill:currentColor;}

  footer{
    font-size:12.5px;
    color:var(--muted);
    opacity:0.8;
  }
  footer a{color:var(--accent-2); text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:480px){
    .progress-wrap{max-width:100%;}
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>

  <div class="wrap">

    <div class="badge"><span class="dot"></span> Scheduled Maintenance In Progress</div>

    <div class="gear-scene" aria-hidden="true">
      <div class="gear big">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="url(#g1)" stroke-width="1.6"/>
          <path d="M12 2v2.3M12 19.7V22M22 12h-2.3M4.3 12H2M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#7c5cff"/>
              <stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="gear small">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="url(#g2)" stroke-width="1.8"/>
          <path d="M12 2v2.3M12 19.7V22M22 12h-2.3M4.3 12H2M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g2" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#ff6b9d"/>
              <stop offset="1" stop-color="#7c5cff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <h1>We're tightening a few bolts.</h1>
    <p class="lead">
      Our site is currently down for scheduled maintenance while we roll out improvements
      and make things faster for you. We'll be back online shortly — thanks for your patience.
    </p>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-caption">
        <span>Upgrade progress</span>
        <span id="progressPct">0%</span>
      </div>
    </div>





  </div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Random progress amount between 0% and 80%, animated in on load
  var progressValue = Math.floor(Math.random() * 81); // 0–80 inclusive
  var fillEl = document.getElementById('progressFill');
  var pctEl = document.getElementById('progressPct');

  fillEl.style.width = '0%';
  pctEl.textContent = '0%';

  setTimeout(function(){
    fillEl.style.width = progressValue + '%';

    // Animate the number counting up alongside the bar fill
    var start = 0;
    var duration = 900;
    var startTime = performance.now();
    function animateCount(now){
      var progress = Math.min(1, (now - startTime) / duration);
      var current = Math.floor(progress * progressValue);
      pctEl.textContent = current + '%';
      if(progress < 1){
        requestAnimationFrame(animateCount);
      } else {
        pctEl.textContent = progressValue + '%';
      }
    }
    requestAnimationFrame(animateCount);
  }, 150);
</script>

</body>
</html>
